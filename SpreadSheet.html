<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>SpreadSheet(Alpha)</title>
        <style>
            body{
                background-color:#333333;
                margin:0px;
                padding:0px;
                text-align:center;
                font-size:18px;
                font-family:Arial;
            }
            input{
                background-color:#333333;
                color:#DDDDDD;
                width:80px;
                height:20px;
                border-radius:0;
            }
            input:hover{
                background-color:#AAAAAA;
                color:#333333;
                border-radius:0;
            }
        </style>
    </head>
    <body>
        <div id="con"></div>
        <script>
            Con=document.getElementById("con");
            fragment=document.createDocumentFragment();
            for(let i=1;i<=500;i++){
                for(let j=1;j<=14;j++){
                    input=document.createElement("input");
                    input.type="text";
                    input.value="";
                    fragment.appendChild(input);
                }
                fragment.appendChild(document.createElement("br"));
            }
            Con.appendChild(fragment);
        </script>
    </body>
</html>
